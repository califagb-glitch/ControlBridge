name: Build DeepCore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Godot Android SDK path
        run: |
          mkdir -p ~/.config/godot
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' "export/android/android_sdk_path = \"$ANDROID_HOME\"" > ~/.config/godot/editor_settings-4.tres

      - name: Export Godot builds
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.4/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.4/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          use_preset_export_path: true
          archive_output: true
          cache: true
          verbose: true
          presets_to_export: Windows Desktop,Android

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: DeepCore-builds
          path: build/**/*
