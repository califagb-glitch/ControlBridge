name: Build ControlBridge APKs

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar Mobile e TV
        run: gradle :mobile:assembleDebug :tv:assembleDebug --no-daemon

      - name: Salvar APKs
        uses: actions/upload-artifact@v4
        with:
          name: ControlBridge-APKs
          path: |
            mobile/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
